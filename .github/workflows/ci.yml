name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Fixture policy gate
        run: pnpm hygiene:fixtures

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests with coverage
        run: pnpm test:coverage

      - name: Coverage gate
        run: pnpm coverage:gate

      - name: Build
        run: pnpm build

      - name: Performance budget gate
        run: pnpm perf:budget

      - name: E2E smoke
        run: pnpm test:e2e

      - name: E2E Xenolab (chromium)
        run: pnpm exec playwright test tests/e2e/xenolab.spec.ts --project=chromium
